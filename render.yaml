# Receita para a Render (render.com): "New > Blueprint" lê este arquivo e cria tudo de uma vez.
# Os valores marcados com "sync: false" são segredos: a Render pergunta cada um na hora de criar.
services:
  - type: web
    name: garagefit-bot
    runtime: docker
    plan: starter # o plano gratuito "dorme" e perderia mensagens; este fica sempre ligado
    region: oregon # a Render não tem região no Brasil
    healthCheckPath: /health
    autoDeploy: true # editou o instrucoes.md no GitHub? a Render atualiza o bot sozinha
    disk:
      name: dados
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      # Modo de conexão: qr (simples, número da academia por QR code) ou cloud (API oficial da Meta).
      - key: WHATSAPP_MODO
        value: qr
      # Modelo de IA. Para respostas mais cuidadosas (e mais caras), troque por claude-sonnet-5-5.
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      # As 5 variáveis abaixo são usadas SÓ no modo cloud (API da Meta). No modo qr, deixe em branco.
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: NUMERO_RECEPCAO
        sync: false
      # Enquanto testa: só o seu número (com DDD). Depois de aprovar, apague o valor para liberar todos.
      - key: NUMEROS_PERMITIDOS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # Nomes dos professores para a página /agenda (ex.: "Ana, Bia"). Vazio = página desligada.
      - key: AGENDA_PROFESSORES
        sync: false
